<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disable Tailmox</title>
<style>
__MONITOR_FORM_STYLE__
* { box-sizing: border-box; }
header { flex-wrap: wrap; }
header > div { min-width: 0; }
h1, h2 { letter-spacing: 0; overflow-wrap: anywhere; }
.migration-section { margin-bottom: 20px; }
.migration-form { gap: 14px; }
.migration-form select { width: 100%; max-width: 100%; border: 1px solid rgba(148,163,184,0.34); border-radius: 8px; padding: 11px 12px; color: var(--text); background: rgba(2,6,23,0.42); font: inherit; }
.migration-form select:focus { outline: 2px solid rgba(56,189,248,0.34); border-color: var(--accent); }
.checkbox-label { display: flex; align-items: center; gap: 10px; }
.checkbox-label input { width: 16px; height: 16px; flex: 0 0 16px; margin: 0; accent-color: var(--accent); }
.field { display: grid; gap: 7px; min-width: 0; }
button:disabled { opacity: .5; cursor: default; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, monospace; margin: 0; }
.warning, #error { color: #fecdd3; line-height: 1.5; }
.danger { border-color: rgba(239,68,68,0.5); color: #fecaca; background: rgba(127,29,29,0.3); }
#scanStatus:empty, #error:empty { display: none; }
[hidden] { display: none !important; }
@media (max-width: 600px) { main { padding: 20px 16px; } header { align-items: flex-start; } header .actions { width: 100%; } .page-picker select { max-width: 100%; } }
</style>
</head>
<body><main>
<header><div><h1>Disable Tailmox</h1><div class="muted">Corosync LAN migration</div></div><div class="actions"><label class="page-picker">Page
<select id="pagePicker" aria-label="Tailmox page"><option value="id">ID</option><option value="settings">Settings</option><option value="health">Health</option><option value="./">Monitor</option><option value="disable" selected>Disable Tailmox</option></select>
</label></div></header>
<section class="panel migration-section">
<h2>Migration settings</h2>
<form id="planForm" class="migration-form">
<div class="field">
<label for="subnet">LAN subnet</label>
<select id="subnet" required><option value="" disabled selected>Scanning host subnets...</option><option value="manual">Enter manually</option></select>
<p id="scanStatus" class="muted" role="status"></p>
</div>
<div id="manualSubnet" class="field" hidden><label for="cidr">Manual subnet</label><input id="cidr" type="text" placeholder="192.168.1.0/24" autocomplete="off" disabled></div>
<label class="checkbox-label"><input id="keep" type="checkbox"> Keep Tailscale as a fallback</label>
<div class="actions"><button id="dryRun" type="submit">Run dry run</button></div>
</form>
<p id="error" role="alert"></p>
</section>
<section class="panel migration-section" aria-live="polite"><h2 id="status">No migration started</h2><pre id="output"></pre></section>
<section class="panel migration-section" id="confirmation" hidden>
<h2>Confirm migration</h2>
<p class="warning">This changes cluster networking. A failure can lose quorum and trigger HA recovery. Keep console access available. The dry run does not guarantee live LAN connectivity.</p>
<div class="migration-form field"><label for="accept">Type DISABLE to apply the plan above</label><input id="accept" type="text" autocomplete="off">
<div class="actions"><button id="apply" class="danger" type="button" disabled>Apply migration</button><button id="cancel" type="button">Cancel</button></div></div>
</section>
</main>
<script>
const apiPrefix = (location.pathname === '/monitor' || location.pathname.startsWith('/monitor/')) ? '/monitor' : (location.pathname === '/control' || location.pathname.startsWith('/control/')) ? '/control' : '';
const byId = id => document.getElementById(id);
let state = {status: 'idle'};
let requesting = false;
let subnetTouched = false;
function updateSubnetInput() {
    const manual = byId('subnet').value === 'manual';
    byId('manualSubnet').hidden = !manual;
    byId('cidr').required = manual;
    byId('cidr').disabled = !manual || requesting || ['running', 'awaiting_confirmation', 'applying'].includes(state.status);
}
byId('subnet').addEventListener('change', () => { subnetTouched = true; updateSubnetInput(); });
byId('pagePicker').addEventListener('change', event => { location.href = `${apiPrefix}/${event.target.value.replace(/^\.\/$/, '')}`; });
function render(data) {
    state = data;
    const busy = ['running', 'awaiting_confirmation', 'applying'].includes(data.status);
    byId('subnet').disabled = busy || requesting;
    byId('keep').disabled = busy || requesting;
    byId('dryRun').disabled = busy || requesting;
    if (busy && data.cidr) {
        const found = [...byId('subnet').options].some(option => option.value === data.cidr);
        byId('subnet').value = found ? data.cidr : 'manual';
        byId('cidr').value = data.cidr; byId('keep').checked = data.keepTailscale;
    }
    updateSubnetInput();
    byId('status').textContent = ({idle: 'No migration started', running: 'Dry run in progress', awaiting_confirmation: 'Dry run passed', applying: 'Migration in progress', succeeded: 'Migration complete', failed: 'Migration stopped', cancelled: 'Migration cancelled', expired: 'Confirmation expired'})[data.status] || data.status;
    byId('output').textContent = data.output || '';
    byId('confirmation').hidden = data.status !== 'awaiting_confirmation';
    byId('apply').disabled = requesting || data.status !== 'awaiting_confirmation' || byId('accept').value !== 'DISABLE';
    byId('cancel').disabled = requesting;
}
async function api(operation, payload) {
    const response = await fetch(`${apiPrefix}/api/migration${operation ? '/' + operation : ''}`, payload ? {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': '__CSRF_TOKEN__'}, body: JSON.stringify(payload)
    } : {cache: 'no-store'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Unable to contact migration service.');
    return data;
}
async function submit(operation, payload) {
    requesting = true; render(state); byId('error').textContent = '';
    try { render(await api(operation, payload)); }
    catch (error) { byId('error').textContent = error.message; }
    finally { requesting = false; render(state); }
}
byId('planForm').addEventListener('submit', event => {
    event.preventDefault(); byId('accept').value = '';
    const cidr = byId('subnet').value === 'manual' ? byId('cidr').value.trim() : byId('subnet').value;
    submit('start', {cidr, keepTailscale: byId('keep').checked});
});
byId('accept').addEventListener('input', () => render(state));
byId('apply').addEventListener('click', () => submit('decide', {token: state.token, decision: byId('accept').value}));
byId('cancel').addEventListener('click', () => submit('decide', {token: state.token, decision: 'cancel'}));
async function refresh() {
    if (!requesting) {
        try { render(await api('')); }
        catch (error) { byId('error').textContent = error.message; }
    }
    setTimeout(refresh, 1500);
}
async function scanSubnets() {
    try {
        const data = await api('subnets');
        const selected = byId('subnet').value;
        const options = data.subnets.map(subnet => new Option(`${subnet.cidr} (${subnet.interfaces.map(item => item.name).join(', ')})`, subnet.cidr));
        byId('subnet').replaceChildren(new Option('Select a subnet', ''), ...options, new Option('Enter manually', 'manual'));
        byId('subnet').options[0].disabled = true;
        byId('subnet').value = subnetTouched ? selected : data.subnets.length ? '' : 'manual';
        byId('scanStatus').textContent = data.subnets.length ? '' : 'No LAN subnets found on this host.';
    } catch (error) {
        byId('subnet').value = 'manual';
        byId('scanStatus').textContent = error.message;
    }
    render(state);
}
scanSubnets();
refresh();
</script></body></html>
